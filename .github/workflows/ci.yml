name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Smoke del camino dorado contra el servidor de producción
        env:
          TURSO_DATABASE_URL: file:smoke.db
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          # Secretos efímeros, generados en cada corrida: no hay ninguno guardado en el repositorio.
          export SESSION_SECRET="$(openssl rand -hex 32)" DEMO_RESET_KEY="$(openssl rand -hex 32)"
          npm start > server.log 2>&1 &
          npm run smoke || { cat server.log; exit 1; }
      - run: npm audit --audit-level=high --omit=dev

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.24.3
      # sha256 publicado en gitleaks_8.24.3_checksums.txt
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks verificando su checksum
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar xzf gitleaks.tgz gitleaks
      - name: Buscar secretos en todo el historial
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
